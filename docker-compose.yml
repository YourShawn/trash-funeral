services:
  # Optional solo-demo database. Not started by default (`docker compose up`
  # expects an external MySQL on localhost / a private network — never a public IP).
  mysql:
    profiles: ["bundled-mysql"]
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-trash_funeral}
      MYSQL_USER: ${MYSQL_USER:-trash}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-funeral}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
    # Bind only loopback on the host. Other compose services still reach this
    # container as hostname `mysql` on the internal network.
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    # required: false so default `up` does not start or wait for `mysql`.
    # With `--profile bundled-mysql`, Compose still waits until MySQL is healthy.
    depends_on:
      mysql:
        condition: service_healthy
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-trash_funeral}
      MYSQL_USER: ${MYSQL_USER:-trash}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-funeral}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-please}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-604800000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
  uploads_data:
